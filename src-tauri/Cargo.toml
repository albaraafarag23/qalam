[package]
name = "qalam"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qalam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native"] }
# Loads Microsoft's ONNX Runtime at startup (tools/fetch-onnxruntime.sh) instead of linking a
# prebuilt copy, which needs a newer glibc than many Linux systems have.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "api-31"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Spellcheck: a pure-Rust Hunspell (see src/spell.rs).
spellbook = "0.3"
# English grammar, offline (see src/grammar.rs). The thesaurus feature is left out: it adds
# ~5 MB and Qalam doesn't use it.
harper-core = { version = "2.13", default-features = false, features = ["concurrent"] }
tauri-plugin-dialog = "2"
base64 = "0.22"

# Windows only: reach the WebView2 settings that Tauri doesn't expose (see lib.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
