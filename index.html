<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qalam</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">Qalam <span class="brand-ar">قلم</span></span>
      <div class="tools">
        <button data-cmd="h1" title="Heading (Ctrl+Alt+1)">H1</button>
        <button data-cmd="h2" title="Subheading (Ctrl+Alt+2)">H2</button>
        <button data-cmd="p" title="Body text (Ctrl+Alt+0)">¶</button>
        <span class="sep"></span>
        <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <span class="sep"></span>
        <button data-cmd="ul" title="Bulleted list">•</button>
        <button data-cmd="ol" title="Numbered list">1.</button>
      </div>
    </header>

    <main class="desk">
      <article id="page" class="page"></article>
    </main>

    <footer class="status">
      <span id="words">0 words</span>
      <span id="dir"></span>
    </footer>
  </body>
</html>
