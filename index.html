<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qalam</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">Qalam <span class="brand-ar">قلم</span></span>
      <div class="tools">
        <button data-cmd="h1" title="Heading (Ctrl+Alt+1)">H1</button>
        <button data-cmd="h2" title="Subheading (Ctrl+Alt+2)">H2</button>
        <button data-cmd="p" title="Body text (Ctrl+Alt+0)">¶</button>
        <span class="sep"></span>
        <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <span class="sep"></span>
        <button data-cmd="ul" title="Bulleted list">•</button>
        <button data-cmd="ol" title="Numbered list">1.</button>
        <span class="sep"></span>
        <select id="arabic-font" title="Arabic font">
          <option value="amiri">أميري · Amiri</option>
          <option value="vazirmatn">وزیرمتن · Vazirmatn</option>
          <option value="scheherazade">شهرزاد · Scheherazade</option>
        </select>
        <!-- Shown only while writing Arabic; last in the row so nothing shifts when it appears. -->
        <div id="arabic-tools" class="arabic-tools" hidden>
          <span class="sep"></span>
          <div class="harakat" id="harakat" dir="rtl" title="الحركات"></div>
          <button id="tashkeel" class="tashkeel" title="تشكيل تلقائي للفقرة أو النص المحدد (Ctrl+Shift+T)">شكّل</button>
          <select id="tashkeel-mode" title="مستوى التشكيل">
            <option value="light">خفيف</option>
            <option value="full">كامل</option>
          </select>
        </div>
      </div>
      <button id="open-settings" class="icon-button" title="Settings">⚙</button>
    </header>

    <main class="desk">
      <article id="page" class="page"></article>
    </main>

    <section id="preview" class="preview" hidden>
      <div class="preview-head">
        <span id="preview-title">التشكيل المقترح</span>
        <span id="preview-note" class="note"></span>
      </div>
      <div id="preview-body" class="preview-body" dir="rtl"></div>
      <div class="preview-actions">
        <button id="preview-accept" class="primary">قبول · Accept</button>
        <button id="preview-cancel">إلغاء · Cancel</button>
      </div>
    </section>

    <dialog id="settings" class="settings">
      <h2>Settings · الإعدادات</h2>
      <label for="api-key">Claude API key</label>
      <p class="hint">Used for automatic تشكيل. It's stored in your system's keyring and only sent to Anthropic.
        Get one at console.anthropic.com → API Keys.</p>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
      <p id="key-status" class="hint"></p>
      <div class="settings-actions">
        <button id="key-remove">Remove key</button>
        <span class="grow"></span>
        <button id="key-save" class="primary">Save key</button>
      </div>
      <hr class="settings-rule" />
      <label>تشكيل learning</label>
      <p id="memory-status" class="hint"></p>
      <div class="settings-actions">
        <button id="memory-forget">Forget corrections</button>
        <span class="grow"></span>
        <button id="settings-close">Close</button>
      </div>
    </dialog>

    <footer class="status">
      <span class="status-left">
        <span id="words">0 words</span>
        <button id="auto-punct" class="status-toggle" title="Adds missing capitals and punctuation to an English paragraph when you press Enter at its end">Auto-punctuation: on</button>
      </span>
      <span id="dir"></span>
    </footer>
  </body>
</html>
