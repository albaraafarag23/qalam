# Builds Qalam's installers on GitHub's machines: a Windows installer (.exe and .msi) and
# Linux packages (.deb and .AppImage). Run it from the Actions tab ("Run workflow") or by
# pushing a version tag like v0.1.0. The installers are attached to the run as artifacts.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            name: linux
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: ONNX Runtime (for the offline models)
        shell: bash
        run: ./tools/fetch-onnxruntime.sh

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: qalam-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
